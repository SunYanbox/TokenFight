name: Code Format Check

on:
    push:
        paths:
            - '**/*.cs'
            - '**/*.csproj'
            - '**/*.sln*'
            - '**/*.props'
            - '**/*.targets'
            - 'global.json'
            - 'Directory.Build.*'
            - 'Directory.Packages.props'
            - '.editorconfig'
            - '.github/workflows/**'
    pull_request:
        paths:
            - '**/*.cs'
            - '**/*.csproj'
            - '**/*.sln*'
            - '**/*.props'
            - '**/*.targets'
            - 'global.json'
            - 'Directory.Build.*'
            - 'Directory.Packages.props'
            - '.editorconfig'
            - '.github/workflows/**'

jobs:
    format-check:
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: '9.0.x'

            - name: Cache about nuget packages
              uses: actions/cache@v4
              with:
                path: ~/.nuget/packages
                key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                restore-keys: |
                  ${{ runner.os }}-nuget-
            - name: Restore dependencies
              run: dotnet restore

            - name: Verify formatting
              run: dotnet format --verify-no-changes